<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Stock Tracker</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Financial Stock Tracker</h1>
            <div class="header-controls">
                <div class="time-range">
                    <button class="time-btn active" data-range="1D">1D</button>
                    <button class="time-btn" data-range="1W">1W</button>
                    <button class="time-btn" data-range="1M">1M</button>
                    <button class="time-btn" data-range="3M">3M</button>
                    <button class="time-btn" data-range="1Y">1Y</button>
                </div>
            </div>
        </header>

        <div class="stock-selector">
            <div class="stock-tabs">
                <button class="stock-tab active" data-stock="AAPL">
                    <span class="stock-symbol">AAPL</span>
                    <span class="stock-name">Apple Inc.</span>
                </button>
                <button class="stock-tab" data-stock="GOOGL">
                    <span class="stock-symbol">GOOGL</span>
                    <span class="stock-name">Alphabet Inc.</span>
                </button>
                <button class="stock-tab" data-stock="MSFT">
                    <span class="stock-symbol">MSFT</span>
                    <span class="stock-name">Microsoft Corp.</span>
                </button>
                <button class="stock-tab" data-stock="TSLA">
                    <span class="stock-symbol">TSLA</span>
                    <span class="stock-name">Tesla Inc.</span>
                </button>
                <button class="stock-tab" data-stock="AMZN">
                    <span class="stock-symbol">AMZN</span>
                    <span class="stock-name">Amazon.com Inc.</span>
                </button>
            </div>
        </div>

        <div class="main-content">
            <div class="stock-info">
                <div class="stock-price-section">
                    <h2 id="current-stock-name">Apple Inc. (AAPL)</h2>
                    <div class="price-display">
                        <span id="current-price">$175.43</span>
                        <span id="price-change" class="positive">+2.15 (+1.24%)</span>
                    </div>
                    <div class="stock-metrics">
                        <div class="metric">
                            <span class="metric-label">Open</span>
                            <span class="metric-value" id="open-price">$173.28</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">High</span>
                            <span class="metric-value" id="high-price">$176.82</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">Low</span>
                            <span class="metric-value" id="low-price">$172.95</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">Volume</span>
                            <span class="metric-value" id="volume">45.2M</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">Market Cap</span>
                            <span class="metric-value" id="market-cap">$2.75T</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">P/E Ratio</span>
                            <span class="metric-value" id="pe-ratio">28.45</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="chart-container">
                <canvas id="stockChart"></canvas>
            </div>

            <div class="additional-info">
                <div class="info-card">
                    <h3>52 Week Range</h3>
                    <div class="range-display">
                        <span id="week-low">$124.17</span>
                        <div class="range-bar">
                            <div class="range-fill"></div>
                            <div class="current-position"></div>
                        </div>
                        <span id="week-high">$199.62</span>
                    </div>
                </div>

                <div class="info-card">
                    <h3>Key Statistics</h3>
                    <div class="stats-grid">
                        <div class="stat">
                            <span class="stat-label">Beta</span>
                            <span class="stat-value" id="beta">1.29</span>
                        </div>
                        <div class="stat">
                            <span class="stat-label">EPS</span>
                            <span class="stat-value" id="eps">$6.16</span>
                        </div>
                        <div class="stat">
                            <span class="stat-label">Dividend Yield</span>
                            <span class="stat-value" id="dividend">0.50%</span>
                        </div>
                        <div class="stat">
                            <span class="stat-label">Avg Volume</span>
                            <span class="stat-value" id="avg-volume">52.3M</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
